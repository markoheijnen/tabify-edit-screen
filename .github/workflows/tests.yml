name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP analysis and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check

  php:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        wordpress: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          tools: composer:v2
          coverage: none
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y subversion default-mysql-client
          composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l
      - name: Install WordPress tests
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 '${{ matrix.wordpress }}' true
      - name: Run integration tests
        run: vendor/bin/phpunit --fail-on-warning

  browser:
    name: Browser interactions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: npm --prefix tests/browser ci
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm --prefix tests/browser test
