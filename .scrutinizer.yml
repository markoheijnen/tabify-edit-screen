checks:
    php:
        code_rating:        true
        duplication:        true
        no_exit:            false
        no_global_keyword:  false
        one_class_per_file: false
filter:
    dependency_paths:
        - wordpress/
    excluded_paths:
        - tests/*
        - bin/*
        - languages/*
tools:
    php_code_sniffer:
        config:
            standard: "WordPress"

build:
    nodes:
        analysis:
            environment:
                php:
                    version: '8.2'
            dependencies:
                # Replace inferred commands so the image's Composer 1 is never used.
                override:
                    - curl --fail --silent --show-error --location https://getcomposer.org/download/latest-2.x/composer.phar --output /tmp/tabify-composer.phar
                    - php /tmp/tabify-composer.phar require --dev --no-update --no-interaction johnpbloch/wordpress
                    - php /tmp/tabify-composer.phar config allow-plugins.johnpbloch/wordpress-core-installer true
                    - php /tmp/tabify-composer.phar update --no-interaction --prefer-dist
            tests:
                override:
                    - php-scrutinizer-run
